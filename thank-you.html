<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Kayberg Enterprises</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .thank-you-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
        }
        
        .success-box {
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 50px 30px;
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.1);
        }
        
        .success-icon {
            font-size: 80px;
            color: var(--primary);
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        
        .success-box h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        .success-box p {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--gray);
        }
        
        .success-box .highlight {
            color: var(--primary);
            font-weight: bold;
        }
        
        .return-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--primary);
            color: var(--dark);
            text-decoration: none;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .return-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.2);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="thank-you-container">
            <div class="success-box">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                
                <h1>Thank You!</h1>
                
                <p>Your enquiry has been sent successfully.</p>
                <p><span class="highlight">Kayberg Enterprises</span> will respond to your industrial gas requirements within 24 hours.</p>
                <p>For urgent matters, please call us directly at:</p>
                <p class="highlight" style="font-size: 1.5rem;">083 225 8839</p>
                
                <a href="/" class="return-btn">
                    <i class="fas fa-home"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-redirect after 15 seconds
        setTimeout(() => {
            window.location.href = "/";
        }, 15000);
    </script>
</body>
</html>
